<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cek Harga Barang - Toko</title>
<script src="https://unpkg.com/@zxing/library@0.21.3"></script>
<script src="https://unpkg.com/@zxing/browser@0.1.5"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #f0f2f5;
    color: #1a1a1a;
    min-height: 100vh;
    padding: 16px;
  }
  .container {
    max-width: 480px;
    margin: 0 auto;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    overflow: hidden;
  }
  header {
    background: linear-gradient(135deg, #2563eb, #1e40af);
    color: #fff;
    padding: 18px 20px;
    text-align: center;
  }
  header h1 { font-size: 20px; font-weight: 600; }
  header p { font-size: 13px; opacity: 0.9; margin-top: 4px; }

  /* ===== Tab Menu ===== */
  .tabs {
    display: flex;
    background: #f8fafc;
    border-bottom: 1px solid #e5e7eb;
  }
  .tab {
    flex: 1;
    padding: 12px 8px;
    text-align: center;
    font-size: 13px;
    font-weight: 600;
    color: #6b7280;
    cursor: pointer;
    border: none;
    background: transparent;
    border-bottom: 3px solid transparent;
    transition: all 0.2s;
  }
  .tab.active {
    color: #2563eb;
    border-bottom-color: #2563eb;
    background: #fff;
  }
  .tab:hover:not(.active) { background: #eef2ff; }

  .tab-content { display: none; }
  .tab-content.active { display: block; }

  /* ===== Scanner Modal ===== */
  .scanner-modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    z-index: 999;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .scanner-modal.show { display: flex; }
  .scanner-box {
    width: 100%;
    max-width: 420px;
    background: #000;
    border-radius: 16px;
    overflow: hidden;
    position: relative;
  }
  .scanner-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 14px;
    background: #111;
    color: #fff;
    font-size: 14px;
    gap: 8px;
  }
  .scanner-header .title { flex: 1; }
  .scanner-header button {
    background: transparent;
    border: none;
    color: #fff;
    font-size: 22px;
    cursor: pointer;
    line-height: 1;
    padding: 4px 8px;
    border-radius: 6px;
  }
  .scanner-header button:hover { background: rgba(255,255,255,0.15); }
  .scanner-header .torch-btn.active { background: #f59e0b; color: #000; }

  .video-wrap {
    position: relative;
    aspect-ratio: 4/3;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  #video { width: 100%; height: 100%; object-fit: cover; }
  .scan-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }
  .scan-frame {
    width: 70%;
    height: 50%;
    border: 3px solid #22c55e;
    border-radius: 12px;
    box-shadow: 0 0 0 9999px rgba(0,0,0,0.35);
  }
  .scan-line {
    position: absolute;
    width: 70%;
    height: 2px;
    background: #22c55e;
    animation: scan 2s linear infinite;
    box-shadow: 0 0 8px #22c55e;
  }
  @keyframes scan {
    0% { top: 25%; }
    50% { top: 75%; }
    100% { top: 25%; }
  }

  /* ===== Form ===== */
  .form-section { padding: 16px; }
  .form-group { margin-bottom: 12px; }
  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: #374151;
    margin-bottom: 6px;
  }
  input {
    width: 100%;
    padding: 12px;
    border: 1.5px solid #d1d5db;
    border-radius: 10px;
    font-size: 15px;
    transition: border 0.2s;
  }
  input:focus {
    outline: none;
    border-color: #2563eb;
  }

  /* ===== Readonly input ===== */
  input[readonly] {
    background: #f3f4f6;
    color: #374151;
    cursor: not-allowed;
  }
  input[readonly]:focus { border-color: #d1d5db; }

  .barcode-row {
    display: flex;
    gap: 8px;
    align-items: stretch;
  }
  .barcode-row input { flex: 1; }
  .btn-cam {
    width: 48px;
    min-width: 48px;
    border: none;
    border-radius: 10px;
    background: #2563eb;
    color: #fff;
    font-size: 22px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s;
  }
  .btn-cam:hover { background: #1d4ed8; }
  .btn-cam:active { transform: scale(0.95); }
  .btn-cam:disabled { background: #9ca3af; cursor: not-allowed; }

  .btn-row { display: flex; gap: 10px; margin-top: 6px; }
  button.btn-main {
    flex: 1;
    padding: 14px;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }
  button.btn-main:active { transform: scale(0.97); }
  .btn-secondary { background: #e5e7eb; color: #374151; }
  .btn-secondary:hover { background: #d1d5db; }

  .status {
    padding: 12px 16px;
    font-size: 13px;
    text-align: center;
    border-radius: 8px;
    margin: 0 16px 12px;
    display: none;
  }
  .status.show { display: block; }
  .status.success { background: #dcfce7; color: #166534; }
  .status.error { background: #fee2e2; color: #991b1b; }
  .status.info { background: #dbeafe; color: #1e40af; }

  .last-scan {
    padding: 0 16px 16px;
    font-size: 13px;
    color: #6b7280;
    text-align: center;
  }

  /* ===== Search Results ===== */
  .search-result-item {
    border: 1px solid #e5e7eb;
    border-radius: 10px;
    padding: 12px;
    margin-bottom: 8px;
    background: #fff;
  }
  .search-result-item .name {
    font-weight: 600;
    font-size: 15px;
    margin-bottom: 4px;
    color: #111827;
  }
  .search-result-item .meta {
    font-size: 12px;
    color: #6b7280;
    margin-bottom: 6px;
  }
  .search-result-item .price-box {
    margin-top: 8px;
    display: flex;
    gap: 10px;
    align-items: baseline;
    flex-wrap: wrap;
  }
  .search-result-item .price-main {
    font-size: 18px;
    font-weight: 700;
    color: #059669;
  }
  .search-result-item .price-old {
    font-size: 13px;
    color: #9ca3af;
    text-decoration: line-through;
  }
  .search-result-item .price-promo {
    font-size: 18px;
    font-weight: 700;
    color: #dc2626;
  }
  .search-result-item .stock-box {
    margin-top: 6px;
    font-size: 12px;
    color: #7c3aed;
    font-weight: 600;
  }
  .search-result-item .stock-box.habis { color: #dc2626; }

  .search-empty {
    text-align: center;
    padding: 24px;
    color: #9ca3af;
    font-size: 13px;
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>📦 Cek Harga Barang</h1>
    <p>Scan barcode / QR atau cari nama untuk melihat harga</p>
  </header>

  <div class="tabs">
    <button class="tab active" data-tab="scan">📷 Scan Barcode</button>
    <button class="tab" data-tab="search">🔍 Cari Barang</button>
  </div>

  <div class="status" id="status"></div>

  <!-- ================= TAB: SCAN (READ-ONLY) ================= -->
  <div class="tab-content active" id="tab-scan">
    <div class="form-section">
      <div class="form-group">
        <label>Barcode / QR Code</label>
        <div class="barcode-row">
          <input type="text" id="barcode" placeholder="Scan atau ketik manual..." autocomplete="off" inputmode="numeric">
          <button class="btn-cam" id="camBtn" title="Scan dengan kamera">📷</button>
        </div>
      </div>
      <div class="form-group">
        <label>Nama Barang</label>
        <input type="text" id="nama" readonly>
      </div>
      <div class="form-group">
        <label>Harga Normal (Rp)</label>
        <input type="text" id="hargaNormal" readonly placeholder="-">
      </div>
      <div class="form-group">
        <label>Harga Promo (Rp)</label>
        <input type="text" id="hargaPromo" readonly placeholder="-">
      </div>
      <div class="form-group">
        <label>Stok</label>
        <input type="number" id="stok" readonly placeholder="-">
      </div>

      <div class="btn-row">
        <button class="btn-main btn-secondary" id="resetBtn">🔄 Reset</button>
      </div>
    </div>

    <div class="last-scan" id="lastScan"></div>
  </div>

  <!-- ================= TAB: CARI BARANG ================= -->
  <div class="tab-content" id="tab-search">
    <div class="form-section">
      <div class="form-group">
        <label>Cari berdasarkan nama atau barcode</label>
        <div class="barcode-row">
          <input type="text" id="searchInput" placeholder="Ketik nama barang / barcode..." autocomplete="off">
          <button class="btn-cam" id="searchBtn" title="Cari">🔍</button>
        </div>
      </div>

      <div id="searchResults"></div>
    </div>
  </div>
</div>

<!-- ===== Modal Scanner ===== -->
<div class="scanner-modal" id="scannerModal">
  <div class="scanner-box">
    <div class="scanner-header">
      <span class="title">📷 Arahkan ke barcode / QR</span>
      <button class="torch-btn" id="torchBtn" title="Senter">🔦</button>
      <button id="closeCamBtn" title="Tutup">✕</button>
    </div>
    <div class="video-wrap">
      <video id="video" playsinline muted></video>
      <div class="scan-overlay">
        <div class="scan-frame"></div>
        <div class="scan-line"></div>
      </div>
    </div>
  </div>
</div>

<script>
// ============================================================
// KONFIGURASI
// ============================================================
const API_URL = "https://script.google.com/macros/s/AKfycbyevpOdfxaKk7N1QkWljFWJm_KYaRFjOY5pUeVj5joITWVG26bo2Sjxu1m4ESXSTAxYkw/exec";

// ============================================================
// ELEMEN
// ============================================================
const video = document.getElementById('video');
const camBtn = document.getElementById('camBtn');
const scannerModal = document.getElementById('scannerModal');
const closeCamBtn = document.getElementById('closeCamBtn');
const torchBtn = document.getElementById('torchBtn');
const resetBtn = document.getElementById('resetBtn');
const statusEl = document.getElementById('status');
const lastScanEl = document.getElementById('lastScan');

const barcodeEl = document.getElementById('barcode');
const namaEl = document.getElementById('nama');
const hargaNormalEl = document.getElementById('hargaNormal');
const hargaPromoEl = document.getElementById('hargaPromo');
const stokEl = document.getElementById('stok');

const searchInput = document.getElementById('searchInput');
const searchBtn = document.getElementById('searchBtn');
const searchResults = document.getElementById('searchResults');

// ============================================================
// STATE
// ============================================================
let codeReader = null;
let controls = null;
let isScanning = false;
let debounceTimer = null;
let searchDebounce = null;
let currentTrack = null;

// ============================================================
// STATUS
// ============================================================
function showStatus(msg, type = 'info') {
  statusEl.textContent = msg;
  statusEl.className = `status show ${type}`;
  if (type !== 'info') {
    setTimeout(() => statusEl.classList.remove('show'), 4000);
  }
}
function hideStatus() { statusEl.classList.remove('show'); }

// ============================================================
// TAB SWITCHING
// ============================================================
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('tab-' + tab.dataset.tab).classList.add('active');
    hideStatus();
  });
});

// ============================================================
// KAMERA - BUKA
// ============================================================
async function openCamera() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    showStatus('❌ Browser tidak mendukung kamera.', 'error');
    return;
  }
  if (location.protocol !== 'https:' && location.hostname !== 'localhost') {
    showStatus('⚠️ Kamera butuh HTTPS. Gunakan GitHub Pages.', 'error');
    return;
  }

  try {
    scannerModal.classList.add('show');
    camBtn.disabled = true;
    torchBtn.classList.remove('active');

    const constraints = {
      video: {
        facingMode: { ideal: 'environment' },
        width: { ideal: 1280 },
        height: { ideal: 720 },
        advanced: [{ focusMode: 'continuous' }]
      }
    };

    const hints = new Map();
    const formats = [
      ZXing.BarcodeFormat.QR_CODE,
      ZXing.BarcodeFormat.DATA_MATRIX,
      ZXing.BarcodeFormat.CODE_128,
      ZXing.BarcodeFormat.CODE_39,
      ZXing.BarcodeFormat.CODE_93,
      ZXing.BarcodeFormat.CODABAR,
      ZXing.BarcodeFormat.EAN_13,
      ZXing.BarcodeFormat.EAN_8,
      ZXing.BarcodeFormat.ITF,
      ZXing.BarcodeFormat.UPC_A,
      ZXing.BarcodeFormat.UPC_E,
      ZXing.BarcodeFormat.PDF_417,
      ZXing.BarcodeFormat.AZTEC
    ];
    hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, formats);
    hints.set(ZXing.DecodeHintType.TRY_HARDER, true);

    codeReader = new ZXingBrowser.BrowserMultiFormatReader(hints, {
      delayBetweenScanAttempts: 200,
      delayBetweenScanSuccess: 800
    });

    controls = await codeReader.decodeFromConstraints(
      constraints,
      video,
      (result, err) => {
        if (result && isScanning) {
          onBarcodeScanned(result.getText());
        }
      }
    );

    isScanning = true;

    if (video.srcObject) {
      currentTrack = video.srcObject.getVideoTracks()[0];
      const caps = currentTrack.getCapabilities ? currentTrack.getCapabilities() : {};
      torchBtn.style.display = (caps && caps.torch) ? '' : 'none';
    } else {
      torchBtn.style.display = 'none';
    }
  } catch (err) {
    console.error(err);
    let msg = err.message || String(err);
    if (err.name === 'NotAllowedError') msg = 'Izin kamera ditolak.';
    if (err.name === 'NotFoundError') msg = 'Kamera tidak ditemukan.';
    showStatus('❌ Gagal akses kamera: ' + msg, 'error');
    closeCamera();
  }
}

// ============================================================
// KAMERA - TUTUP
// ============================================================
function closeCamera() {
  isScanning = false;
  if (controls) {
    try { controls.stop(); } catch (e) {}
    controls = null;
  }
  if (codeReader) {
    try { codeReader.reset(); } catch (e) {}
    codeReader = null;
  }
  if (video.srcObject) {
    video.srcObject.getTracks().forEach(t => t.stop());
    video.srcObject = null;
  }
  currentTrack = null;
  scannerModal.classList.remove('show');
  camBtn.disabled = false;
}

// ============================================================
// TORCH
// ============================================================
async function toggleTorch() {
  if (!currentTrack) return;
  try {
    const caps = currentTrack.getCapabilities ? currentTrack.getCapabilities() : {};
    if (!caps.torch) return;
    const current = currentTrack.getSettings().torch || false;
    await currentTrack.applyConstraints({ advanced: [{ torch: !current }] });
    torchBtn.classList.toggle('active', !current);
  } catch (e) {
    console.warn('Torch error', e);
  }
}

// ============================================================
// BARCODE TERBACA
// ============================================================
async function onBarcodeScanned(text) {
  if (!isScanning) return;
  isScanning = false;
  vibrate();
  beep();
  closeCamera();

  barcodeEl.value = text;
  lastScanEl.textContent = `Barcode terakhir: ${text}`;
  await lookupBarcode(text);
}

// ============================================================
// LOOKUP BARCODE (READ-ONLY + FORMAT TITIK)
// ============================================================
async function lookupBarcode(text) {
  const barcode = String(text || '').trim();
  if (!barcode) return;

  showStatus('🔍 Mengecek barcode ' + barcode + '...', 'info');

  try {
    const res = await fetch(API_URL + '?barcode=' + encodeURIComponent(barcode), {
      method: 'GET',
      mode: 'cors'
    });
    const data = await res.json();

    if (data.found && data.item) {
      namaEl.value = data.item.nama || '';

      // Format harga dengan titik ribuan
      hargaNormalEl.value = Number(data.item.hargaNormal) > 0
        ? formatRp(data.item.hargaNormal)
        : '';
      hargaPromoEl.value = Number(data.item.hargaPromo) > 0
        ? formatRp(data.item.hargaPromo)
        : '';

      stokEl.value = data.item.stok !== '' && data.item.stok !== null && data.item.stok !== undefined
        ? data.item.stok
        : '';

      // Pesan status dengan format titik
      const hargaNormal = Number(data.item.hargaNormal) || 0;
      const hargaPromo = Number(data.item.hargaPromo) || 0;
      const adaPromo = hargaPromo > 0 && hargaPromo < hargaNormal;
      const pesan = adaPromo
        ? `✅ ${data.item.nama} — Promo Rp ${formatRp(hargaPromo)} (normal Rp ${formatRp(hargaNormal)})`
        : `✅ ${data.item.nama} — Rp ${formatRp(hargaNormal)}`;
      showStatus(pesan, 'success');
    } else {
      namaEl.value = '';
      hargaNormalEl.value = '';
      hargaPromoEl.value = '';
      stokEl.value = '';
      showStatus('❌ Barcode tidak terdaftar di database.', 'error');
    }
  } catch (err) {
    console.error(err);
    showStatus('⚠️ Gagal cek ke server.', 'error');
  }
}

// ============================================================
// BEEP & VIBRATE
// ============================================================
function beep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.frequency.value = 880;
    osc.type = 'sine';
    gain.gain.setValueAtTime(0.3, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.15);
    osc.start();
    osc.stop(ctx.currentTime + 0.15);
  } catch (e) {}
}
function vibrate() {
  if (navigator.vibrate) navigator.vibrate(120);
}

// ============================================================
// RESET FORM
// ============================================================
function resetForm() {
  barcodeEl.value = '';
  namaEl.value = '';
  hargaNormalEl.value = '';
  hargaPromoEl.value = '';
  stokEl.value = '';
}

// ============================================================
// SEARCH BY NAME (READ-ONLY)
// ============================================================
async function searchByName(query) {
  const q = String(query || '').trim();
  if (!q) {
    searchResults.innerHTML = '<div class="search-empty">Ketik nama barang untuk mencari.</div>';
    return;
  }

  searchResults.innerHTML = '<div class="search-empty">🔍 Mencari...</div>';

  try {
    const res = await fetch(API_URL + '?nama=' + encodeURIComponent(q), {
      method: 'GET',
      mode: 'cors'
    });
    const data = await res.json();

    let items = [];
    if (Array.isArray(data.items)) items = data.items;
    else if (data.found && data.item) items = [data.item];
    else if (Array.isArray(data.data)) items = data.data;

    if (!items.length) {
      searchResults.innerHTML = '<div class="search-empty">😕 Barang tidak ditemukan.</div>';
      return;
    }

    renderSearchResults(items);
  } catch (err) {
    console.error(err);
    searchResults.innerHTML = '<div class="search-empty">⚠️ Gagal mencari ke server.</div>';
  }
}

function renderSearchResults(items) {
  searchResults.innerHTML = '';
  items.forEach(item => {
    const div = document.createElement('div');
    div.className = 'search-result-item';

    const hargaNormal = Number(item.hargaNormal) || 0;
    const hargaPromo = Number(item.hargaPromo) || 0;
    const adaPromo = hargaPromo > 0 && hargaPromo < hargaNormal;
    const stok = Number(item.stok) || 0;
    const stokHabis = stok <= 0;

    div.innerHTML = `
      <div class="name">${escapeHtml(item.nama || '(tanpa nama)')}</div>
      <div class="meta">🏷️ ${escapeHtml(item.barcode || '-')}</div>
      <div class="price-box">
        ${adaPromo
          ? `<span class="price-old">Rp ${formatRp(hargaNormal)}</span>
             <span class="price-promo">Rp ${formatRp(hargaPromo)}</span>`
          : `<span class="price-main">Rp ${formatRp(hargaNormal)}</span>`}
      </div>
      <div class="stock-box ${stokHabis ? 'habis' : ''}">
        ${stokHabis ? '❌ Stok habis' : `📦 Stok: ${stok}`}
      </div>
    `;
    searchResults.appendChild(div);
  });
}

// ============================================================
// UTIL
// ============================================================
function escapeHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}
function formatRp(v) {
  const n = Number(v);
  if (!isFinite(n) || n === 0) return '0';
  return n.toLocaleString('id-ID');
}

// ============================================================
// EVENT LISTENERS
// ============================================================
camBtn.addEventListener('click', openCamera);
closeCamBtn.addEventListener('click', closeCamera);
torchBtn.addEventListener('click', toggleTorch);
resetBtn.addEventListener('click', () => {
  resetForm();
  lastScanEl.textContent = '';
  hideStatus();
});

barcodeEl.addEventListener('input', () => {
  clearTimeout(debounceTimer);
  const val = barcodeEl.value.trim();
  if (val.length < 4) return;
  debounceTimer = setTimeout(() => {
    if (barcodeEl.value.trim() === val) {
      lookupBarcode(val);
    }
  }, 800);
});

barcodeEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    e.preventDefault();
    clearTimeout(debounceTimer);
    lookupBarcode(barcodeEl.value.trim());
  }
});

searchBtn.addEventListener('click', () => searchByName(searchInput.value));
searchInput.addEventListener('input', () => {
  clearTimeout(searchDebounce);
  const val = searchInput.value.trim();
  if (val.length < 2) {
    searchResults.innerHTML = '';
    return;
  }
  searchDebounce = setTimeout(() => searchByName(val), 500);
});
searchInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    e.preventDefault();
    clearTimeout(searchDebounce);
    searchByName(searchInput.value);
  }
});

scannerModal.addEventListener('click', (e) => {
  if (e.target === scannerModal) closeCamera();
});

if (location.protocol !== 'https:' && location.hostname !== 'localhost') {
  showStatus('⚠️ Kamera butuh HTTPS. Gunakan GitHub Pages.', 'error');
}
</script>
</body>
</html>
