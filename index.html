<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scan Barcode → Google Sheets</title>
<script src="https://unpkg.com/html5-qrcode"></script>
<style>
  * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  body { margin: 0; padding: 16px; background: #f4f6f8; color: #222; }
  h1 { font-size: 20px; margin: 0 0 12px; }
  .card { background: #fff; border-radius: 12px; padding: 16px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,.06); }
  #reader { width: 100%; border-radius: 12px; overflow: hidden; background: #000; }
  button {
    width: 100%; padding: 14px; font-size: 16px; font-weight: 600;
    border: none; border-radius: 10px; margin-top: 10px; cursor: pointer;
  }
  .btn-primary { background: #2563eb; color: #fff; }
  .btn-success { background: #16a34a; color: #fff; }
  .btn-danger  { background: #dc2626; color: #fff; }
  .btn-secondary { background: #e5e7eb; color: #111; }
  label { display: block; font-size: 13px; font-weight: 600; margin: 10px 0 4px; color: #555; }
  input {
    width: 100%; padding: 12px; font-size: 15px; border: 1px solid #ccc;
    border-radius: 8px; background: #fafafa;
  }
  input:focus { outline: 2px solid #2563eb; background: #fff; }
  .status { font-size: 13px; margin-top: 8px; text-align: center; }
  .status.ok { color: #16a34a; }
  .status.err { color: #dc2626; }
</style>
</head>
<body>

<h1>📷 Scan Barcode → Google Sheets</h1>

<!-- ===== KAMERA ===== -->
<div class="card">
  <div id="reader"></div>
  <button class="btn-primary" id="btnStart">Mulai Scan</button>
  <button class="btn-danger" id="btnStop" style="display:none;">Stop Scan</button>
  <div class="status" id="scanStatus">Tekan "Mulai Scan" untuk mengaktifkan kamera.</div>
</div>

<!-- ===== FORM DATA ===== -->
<div class="card">
  <label>Barcode</label>
  <input type="text" id="barcode" placeholder="Otomatis terisi setelah scan" readonly>

  <label>Nama Barang</label>
  <input type="text" id="nama" placeholder="Contoh: Indomie Goreng">

  <label>Harga Normal (Rp)</label>
  <input type="number" id="hargaNormal" placeholder="0" inputmode="numeric">

  <label>Harga Promo (Rp)</label>
  <input type="number" id="hargaPromo" placeholder="0" inputmode="numeric">

  <label>Stok</label>
  <input type="number" id="stok" placeholder="0" inputmode="numeric">

  <button class="btn-success" id="btnSimpan">💾 Simpan ke Google Sheets</button>
  <button class="btn-secondary" id="btnReset">Reset Form</button>
  <div class="status" id="saveStatus"></div>
</div>

<script>
// ============================================================
// 🔴 GANTI URL INI DENGAN URL WEB APP DARI GOOGLE APPS SCRIPT
// ============================================================
const API_URL = "https://script.google.com/macros/s/AKfycbz53ZEK3YppltFZZtfoniKusQCwesfdQ8Hd6rZkJzz2cIUdiQuNeSjb4xlD3wXIvxLrgg/exec";

// ===== KAMERA =====
const html5QrCode = new Html5Qrcode("reader");
const btnStart = document.getElementById("btnStart");
const btnStop  = document.getElementById("btnStop");
const scanStatus = document.getElementById("scanStatus");

let scanning = false;

btnStart.addEventListener("click", async () => {
  try {
    await html5QrCode.start(
      { facingMode: "environment" },
      { fps: 10, qrbox: { width: 280, height: 180 } },
      (decodedText) => {
        document.getElementById("barcode").value = decodedText;
        scanStatus.textContent = "✅ Barcode terdeteksi: " + decodedText;
        scanStatus.className = "status ok";
        // getar HP (kalau didukung)
        if (navigator.vibrate) navigator.vibrate(120);
      },
      () => {} // error scan diabaikan
    );
    scanning = true;
    btnStart.style.display = "none";
    btnStop.style.display = "block";
    scanStatus.textContent = "Arahkan kamera ke barcode...";
  } catch (err) {
    scanStatus.textContent = "❌ Gagal akses kamera: " + err;
    scanStatus.className = "status err";
  }
});

btnStop.addEventListener("click", async () => {
  if (scanning) {
    await html5QrCode.stop();
    scanning = false;
    btnStart.style.display = "block";
    btnStop.style.display = "none";
    scanStatus.textContent = "Kamera dimatikan.";
  }
});

// ===== SIMPAN KE GOOGLE SHEETS =====
const btnSimpan = document.getElementById("btnSimpan");
const saveStatus = document.getElementById("saveStatus");

btnSimpan.addEventListener("click", async () => {
  const data = {
    barcode: document.getElementById("barcode").value.trim(),
    nama: document.getElementById("nama").value.trim(),
    hargaNormal: document.getElementById("hargaNormal").value,
    hargaPromo: document.getElementById("hargaPromo").value,
    stok: document.getElementById("stok").value,
  };

  if (!data.barcode || !data.nama) {
    saveStatus.textContent = "⚠️ Barcode & Nama Barang wajib diisi.";
    saveStatus.className = "status err";
    return;
  }

  saveStatus.textContent = "⏳ Mengirim ke Google Sheets...";
  saveStatus.className = "status";

  try {
    // pakai POST + text/plain agar tidak kena CORS preflight
    const res = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(data)
    });
    const json = await res.json();

    if (json.success) {
      saveStatus.textContent = "✅ Data tersimpan!";
      saveStatus.className = "status ok";
      resetForm(false); // reset tapi jangan hapus status
    } else {
      throw new Error(json.error || "Gagal simpan");
    }
  } catch (err) {
    saveStatus.textContent = "❌ " + err.message;
    saveStatus.className = "status err";
  }
});

// ===== RESET =====
function resetForm(clearStatus = true) {
  document.getElementById("barcode").value = "";
  document.getElementById("nama").value = "";
  document.getElementById("hargaNormal").value = "";
  document.getElementById("hargaPromo").value = "";
  document.getElementById("stok").value = "";
  if (clearStatus) {
    saveStatus.textContent = "";
    saveStatus.className = "status";
  }
}
document.getElementById("btnReset").addEventListener("click", () => resetForm(true));
</script>

</body>
</html>
